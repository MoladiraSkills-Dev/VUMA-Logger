<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VUMA Logger workforce attendance portal - sign in or register.">
  <title>VUMA Logger - Workforce Attendance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="shared/css/base.css">
</head>

<body>
  <!-- GLOBAL SPINNER -->
  <div id="globalSpinner" class="global-spinner-overlay">
    <div class="spinner-ring"></div>
    <p class="spinner-msg" id="spinnerMessage">Processing request...</p>
  </div>

  <main id="mainContainer" class="main-container">

    <!-- ===== AUTHENTICATION VIEW ===== -->
    <section id="authView" class="card animate-in" style="margin-top: 2rem; padding: 2rem;">
      <div class="text-center mb-6">
        <div class="vuma-brand">
          <span class="vuma-brand-text">VUMA</span>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; color: var(--slate-900);"
          id="authTitle">
          VUMA <span style="font-weight: 300; color: var(--vuma-magenta);">Logger</span>
        </h1>
        <p style="font-size: 0.75rem; color: var(--slate-500); margin-top: 0.375rem;" id="authSubtitle">Enter
          credentials to access the workforce portal.</p>
      </div>

      <div id="authAlert" class="alert mb-4"></div>

      <form id="loginForm" class="space-y" onsubmit="handleLoginSubmit(event)">
        <div>
          <label class="input-label">Work Email</label>
          <input type="email" id="loginEmail" required class="input-field" placeholder="name@company.co.za">
        </div>
        <div>
          <label class="input-label">Password</label>
          <input type="password" id="loginPassword" required class="input-field" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Sign In</button>
        <p style="font-size: 0.75rem; text-align: center; color: var(--slate-500); padding-top: 0.75rem;">
          New employee? <a href="#" onclick="toggleAuthMode(false)"
            style="color: var(--vuma-magenta); font-weight: 700; text-decoration: none;">Create account</a>
        </p>
      </form>

      <form id="registerForm" class="space-y hidden" onsubmit="handleRegisterSubmit(event)">
        <div class="grid-2">
          <div><label class="input-label">First Name</label><input type="text" id="regFirst" required
              class="input-field"></div>
          <div><label class="input-label">Last Name</label><input type="text" id="regLast" required class="input-field">
          </div>
        </div>
        <div><label class="input-label">Email Address</label><input type="email" id="regEmail" required
            class="input-field"></div>
        <div><label class="input-label">Create Password</label><input type="password" id="regPassword" required
            class="input-field"></div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Submit Registration</button>
        <p style="font-size: 0.75rem; text-align: center; color: var(--slate-500); padding-top: 0.75rem;">
          Already have an account? <a href="#" onclick="toggleAuthMode(true)"
            style="color: var(--vuma-magenta); font-weight: 700; text-decoration: none;">Sign in instead</a>
        </p>
      </form>
    </section>

  </main>

  <script src="shared/js/api.js"></script>
  <script src="auth/auth.js"></script>
</body>

</html>
